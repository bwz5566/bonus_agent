# 模型配置。选型阶段通过云端 API 调用候选模型；确定后改为本地 vLLM，只需切换 provider。
# API Key 不写在这里：复制 config/secrets.example.yaml 为 config/secrets.yaml（或 ~/.bonus-agent/secrets.yaml）填入（已加入 .gitignore），
# 或设置 api_key_env 指定的环境变量（环境变量优先）。
# 模型是否可用以控制台为准，可运行 `bonus-agent models --remote` 用你的 Key 实际查询。
# 注意：调用云端 API 时，只使用脱敏后的规则文档和数据。

providers:
  dashscope:        # 阿里云百炼，中国内地（北京）地域，OpenAI 兼容模式
    # 官方建议迁移到业务空间专属域名：https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    # 可在 secrets.yaml 里用 base_url 覆盖，旧域名目前仍可用。
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
  deepseek:         # DeepSeek 官方 API，OpenAI 兼容
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  local_vllm:       # 自建 vLLM，部署后使用
    base_url: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY
  local_qwen:       # 自建 Qwen 服务 A（OpenAI 兼容，max-model-len 1M）。Key 写在 secrets.yaml 或环境变量 LOCAL_QWEN_API_KEY
    base_url: http://192.168.81.98:9705/v1
    api_key_env: LOCAL_QWEN_API_KEY
  local_qwen_b:     # 自建 Qwen 服务 B。Key 写在 secrets.yaml 或环境变量 LOCAL_QWEN_B_API_KEY。内网地址程序自动直连、不走代理
    base_url: http://192.168.81.155:8000/v1
    api_key_env: LOCAL_QWEN_B_API_KEY

default: qwen-a

# 智能体相关的可选项（写在每个模型下）：
#   tool_mode: native | json      native 为原生工具调用（默认）；服务不支持时会自动改用 json
#   timeout: 300                  单次请求的超时（秒），默认 300；本地模型打开思考时可加大到 600
#   max_history_chars: 24000      智能体对话历史的上限（字符）。超过时整理一次，压到一半；加大会让每步输入变多
#   cache: explicit               百炼显式缓存（命中部分按输入价 10% 计费，5 分钟有效）。只对支持的模型开启，
#                                 目前候选开源模型都不支持；私有化 vLLM 自带前缀缓存，无需配置
#   tools_extra_body: {...}       智能体工具调用时额外的参数，覆盖 extra_body。如打开思考（enable_thinking: true），
#                                 thinking_budget 限制每步思考的 tokens。写了就是每一步都思考
#   think: auto | false | {...}   按需深度思考：平时不思考，智能体出错、卡住时那一步临时打开思考，想清楚错在哪再改，
#                                 改对了就切回来。auto（默认）从 extra_body 里的关闭开关推出打开的参数
#                                 （enable_thinking: false / chat_template_kwargs 里的 enable_thinking、thinking: false /
#                                 thinking: {type: disabled}）；false 不切换；也可以直接写打开思考时追加的请求参数
#   think_max_tokens: 16384       思考那一步的输出上限（思考内容也算在里面）
#   think_timeout: 900            思考那一步的超时（秒）
#   think_echo: true | false      下一步把思考内容带回去；DeepSeek（thinking 参数）默认带回，其他默认不带
#   think_model: 模型名           深度思考的那一步改用这个（更强的）模型，平时仍用本模型，省成本。
#                                 如 deepseek-flash 平时干活，出错、卡住时那一步交给 deepseek-v4-pro 思考
# 千问 3.5 及以后的模型默认可能开启思考模式，抽取时统一关闭（enable_thinking: false），
# 否则耗时和 tokens 会明显增加，且部分模型思考模式下不支持 JSON 输出。
models:
  # ---- 已下线：最初指定的三个 Qwen3-VL 开源模型 ----
  # 2026-10-28 用 `bonus-agent models --remote` 实测，百炼已不提供这三个 ID，保留仅作记录，不参与选型。
  qwen3-vl-32b:
    provider: dashscope
    model: qwen3-vl-32b-instruct
    json_mode: json_object      # 云端用 json_object；vLLM 可用 json_schema 做约束解码
  qwen3-vl-30b-a3b:
    provider: dashscope
    model: qwen3-vl-30b-a3b-instruct
    json_mode: json_object
  qwen3-vl-8b:
    provider: dashscope
    model: qwen3-vl-8b-instruct
    json_mode: json_object

  # ---- 选型候选：百炼在售、权重开源（可私有化部署）的原生多模态模型（2026-10-28 实测可用）----
  # 输入支持文本、图像、视频。
  qwen3.6-35b-a3b:              # 2026-04 开源，MoE，激活约 3B，对标 30B-A3B 的下一代；上下文 256k
    provider: dashscope
    model: qwen3.6-35b-a3b
    json_mode: json_object
    extra_body: {enable_thinking: false}
    tools_extra_body: {enable_thinking: true, thinking_budget: 2048}
  qwen3.6-27b:                  # 稠密模型，对标 32B 的下一代
    provider: dashscope
    model: qwen3.6-27b
    json_mode: json_object
    extra_body: {enable_thinking: false}
  qwen3.5-35b-a3b:
    provider: dashscope
    model: qwen3.5-35b-a3b
    json_mode: json_object
    extra_body: {enable_thinking: false}
  qwen3.5-27b:
    provider: dashscope
    model: qwen3.5-27b
    json_mode: json_object
    extra_body: {enable_thinking: false}
  qwen3.5-122b-a10b:            # 更大的 MoE，部署成本高，作为开源上限参考
    provider: dashscope
    model: qwen3.5-122b-a10b
    json_mode: json_object
    extra_body: {enable_thinking: false}

  # ---- 第三组：商业版（不能私有化），只用来看效果上限 ----
  qwen3-vl-plus:
    provider: dashscope
    model: qwen3-vl-plus
    json_mode: json_object
    extra_body: {enable_thinking: false}
    cache: explicit
  qwen3.6-flash:
    provider: dashscope
    model: qwen3.6-flash
    json_mode: json_object
    extra_body: {enable_thinking: false}
    cache: explicit

  # ---- DeepSeek（2026-10-29 用 /models 实测：deepseek-flash 能看图，deepseek-v4-pro 只有文本；deepseek-chat 是 flash 的别名）----
  # vision：不能看图的模型写 false，或写另一个能看图的模型名，由它转写图片；不写默认能看图。
  # 不能看图又没配看图模型时，图片里的规则由智能体向财务提问，不会猜。
  deepseek-flash:               # DeepSeek-V4.1-Flash，文本 + 图片，上下文 1M
    provider: deepseek
    model: deepseek-flash
    json_mode: json_object
    extra_body: {thinking: {type: disabled}}     # 默认开思考且 effort=high，一步就能把 8192 个输出 tokens 用完
    think_model: deepseek-v4-pro
    checker: deepseek-v4-pro
    checker_required: true
  deepseek-flash-pro:           # 平时用 flash（低成本），出错、卡住需要深度思考的那一步交给 pro
    provider: deepseek
    model: deepseek-flash
    json_mode: json_object
    extra_body: {thinking: {type: disabled}}
    think_model: deepseek-v4-pro
    checker: deepseek-v4-pro
    checker_required: true
  deepseek-v4-pro:              # DeepSeek-V4-Pro，只有文本，图片交给 deepseek-flash 转写
    provider: deepseek
    model: deepseek-v4-pro
    json_mode: json_object
    extra_body: {thinking: {type: disabled}}
    vision: deepseek-flash

  # ---- 内网自建 Qwen（2026-11-02 起默认用 A）----
  # 平时不思考（Q1–Q7 都是在不思考下算对的）；出错、卡住时按需打开思考（think: auto，从 enable_thinking: false 推出来）。
  # 想每一步都思考时把 tools_extra_body 打开；抽取、复读等要 JSON 的调用始终不思考
  qwen-a:                       # 服务 A：Qwen3.8-27B-FP8，上下文 1M
    provider: local_qwen
    model: qwen-chat
    json_mode: json_object
    timeout: 300
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
    # tools_extra_body: {chat_template_kwargs: {enable_thinking: true}}
  qwen-b:                       # 服务 B：同为 27B（64 层），INT4（W4A16，group 128）单卡 4090，上下文 65536（至少要这么多，开始前会检查）
    provider: local_qwen_b
    model: qwen38-int4
    json_mode: json_object
    timeout: 300
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
    # tools_extra_body: {chat_template_kwargs: {enable_thinking: true}}

  # ---- 私有化部署后 ----
  # 部署时把 model 改成选型胜出的模型（vLLM 启动时的 --served-model-name 或权重路径）
  local:                        # 1 张 48GB 卡即可（FP8）；启动命令见 README「本地模型」
    provider: local_vllm
    model: Qwen/Qwen3.6-35B-A3B
    json_mode: json_schema
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  local-deepseek:               # 约 4 张 80GB 卡；分析能力更强
    provider: local_vllm
    model: deepseek-ai/DeepSeek-V4-Flash
    json_mode: json_schema
    extra_body: {chat_template_kwargs: {thinking: false}}    # vLLM 里 DeepSeek 模板的思考开关；按需思考时打开

# 选型时参与对比的模型（bonus-eval 默认跑 candidates，也可用 --models open,reference 等指定分组）
# 3.6 和 3.5 同尺寸各一个，用来看新一代是否明显更好；稠密 27B 和 MoE 35B-A3B 部署成本不同。
candidates: [qwen3.6-35b-a3b, qwen3.6-27b, qwen3.5-35b-a3b, qwen3.5-27b]
groups:
  open: [qwen3.6-35b-a3b, qwen3.6-27b, qwen3.5-35b-a3b, qwen3.5-27b, qwen3.5-122b-a10b]
  reference: [qwen3-vl-plus, qwen3.6-flash]
  deepseek: [deepseek-flash, deepseek-v4-pro]
  selfhosted: [qwen-a, qwen-b]
  legacy: [qwen3-vl-32b, qwen3-vl-30b-a3b, qwen3-vl-8b]
