version: 1
status: IN_PROGRESS
goal: 财务从正式入口提交本批材料，取得可分配总额、每个人的应分金额及逐项对账依据。材料不足时给出受影响的项目、原因、待补证据和可核定范围。
start: source_coverage
acceptance_plan: docs/commission_acceptance.yaml
workflow: docs/staged_workflow.md
indicator_architecture: docs/indicator_reliability_plan.md
current_focus:
  case: T21
  checkpoint: T21 第 37 轮正式案卷 OK。沿第 26 轮已确认资金完成分配，导出项目核算、人员核算及案卷汇总三份 Excel，逐项核对后封存。
  personnel_reconciliation: 62 个项目的金额与 1112 底稿逐项一致。已用项目引擎复核 324 条份额，19 人合计 91905.70 元，待分配 42835.31 元，舍入尾差 0.01 元。28 个项目的 Q 列为空，底稿引用客户经理 1，按本次已确认口径将相应份额列入待分配。
  personnel_confirmation: 用户已确认 q2「按现有名单分配，无例外」，仅适用于 T21。继续执行原 q1，实名和个人份额只认名单实际 Q 列依据，空角色份额和 NPD 分别记录。已确认项目资金的原审批指纹不变。
  local_repairs: 已确认资金的人员复核可提交带原文的业务问题，程序逐字核对后登记。材料或期间变更时旧问题和答复须重新核对。新增答复进入人员核算，资金方案按自身输入、期间及审批版本核验。资金承接逐项目验证实名原值与待分配之和。终检按同版已确认资金逐对象复验旧独立声明，模型只重建待核方案。T21 的终检请求正文离线测得由 81547 字节降至 60207 字节。
  scoped_answer_resume: 真实 T21 的 13 份材料指纹未变，新执行版本在副本第 32 轮仍停在未答复的 q2，原总额确认及用量账本不变，零外部请求，无正式金额文件。模拟财务答复用例走 Web 和 CLI 共用入口，自动分别重验基础与完整分配公式，沿用项目确认，再完成逐人独立复核、样本验算、正式 Excel 导出和回读。149 项相关离线检查通过。
  settlement_scope_resume: q2 答复后仅可复用同一材料、期间、取数结构和复核路由下已逐项复验的范围声明。独立复核在金额请求中明确确认新答复不改变范围时，少发一次取数请求；否则重查取数。T21 第 32 轮用真实原表预检两路首个请求，164 项相关离线检查通过。
  metered_settlement_handoff: 已从第 32 轮检查点接收真实 q2，沿第 26 轮原确认、13 份授权原件和既有累计账本继续。真实 Pro 第 36 轮保存独立金额公式。针对实际地域名称和 Q 列名称的定向复核确认同一公式结构和原件，独立结论由程序逐项复算。
  t21_comparison_ready: 正式 Excel 回读与引擎 705 项对账一致。与 1112 原底稿的 4 项总额及 248 项逐项目金额一致。48 个客户经理角色原值对应人不同但金额一致，28 个有金额，合计 11601.96 元；8 人的全部金额差异均由 Q 列为空的份额归入待分配解释。
  validation_origin: 项目引擎计算，复用真实 DeepSeek Pro 独立声明，第 37 轮 488 项全量金额、36 项独立样本、397 项数值证据绑定和程序校验全部通过。本地复核了 4 条程序提示并提交依据，重新核对 2 条报表条款，最终结案未新增模型请求。修复条款阅读标记触发复核过期的问题。冻结版本冷启动和独立批次仍待验收。
  verified_template_replay: 使用 T21 第 37 轮封存的规则、映射和原轮 10 份 Excel 数据调用 Template.verify 和 Template.run，基础金额和完整金额指纹均与原轮一致。62 个项目可分配 134741.02 元，19 人应分 91905.70 元。离线复算零模型请求。当前为可复算候选，T21 口径单仍待最终确认，本地销售提成场景未配置发布验收用例及已发布规则版本。
  web_authoring_status: 同材料自测案卷 6c956449058c 第 4 轮通过数据准备，停在 T19 阶梯公式，四轮服务日志合计记录 13811787 tokens。第 4 轮副本已验证自动补验阶梯表和拦截漏用新老项目分类及地区误配的公式。按原文补齐后 62 个项目阶梯金额逐项对齐。新案卷从原始材料完成正式导出仍须独立验收。
  template_check_entry: template-check 已从正式 CLI 复算 T21 第 37 轮。核对 13 份来源材料及两套金额基线，候选指纹 bc92125514b9e694d6c5cab3494261d8c000f2d0535c21d6aaa64d8f589c6f6b。候选检查与确认模板共享复算逻辑。
  web_case_budget: 网页案卷导入历史轮次已报告用量，发请求前落盘预留额度，返回后结算。并发写入用案卷账本锁串行，服务重启或点击从头开始会恢复原累计用量。历史统计以案卷已记录的用量为准。
  early_reference_validation: 新数据门禁在无分配层级时也检查实际关联。重放自测案卷第 4 轮后，数据准备识别出 48 个项目和 13 个客户被误挂到客户预算参考表。已封存 T21 的参考表和分组结构通过同一门禁。
  t22_2_budget_repair: 自测案卷 01d2c565276c 的一次续跑因 Windows 拒绝替换恢复文件而中断，第 2 轮在区域达成任务停止。跨文件同一组合键的旧冲突自动撤回并留存答复。恢复日志使用原子替换和有界重试。真实案卷副本经正式续跑入口零模型调用恢复区域任务，5 个区域的系数与封存结果一致。用实物制度表编译客户档位后，正常公式提交入口修复客户预算的同名关联键，14 个客户的系数逐项一致。T22-2 的后续核算与正式人员导出待验证。
  t22_2_coefficient_dependency: 第 3 轮的自动修复通过 T10，随后停在 T11。已有 5 个客户系数来源格，公式引用的系数表未生成，公式阶段原先不开放编表工具。恢复时从唯一匹配的完整原格行编制并检查系数表，再联合提交映射和公式。用第 3 轮归档从正式入口离线通过 T11 及前置表，5 个区域和 14 个客户的系数均与封存结果一致。T12 所需本年累计金额已在同指纹历史数据表核实覆盖 1 至 9 月，月平均出货及正式导出待核算。
  t22_2_formula_data_preflight: 第 4 轮引用了未定义累计表，诊断建议替换为仅含当月的销售单。任务现可先登记数据集、字段、窗口和关联键。正式续跑在模型请求前发现并复核历史候选，用真实当期 14 个分组对账后绑定累计表，再验证公式。第 4 轮副本零模型调用通过 T12，14 个客户月平均及 T10、T11 的系数与封存结果逐项一致。另验证不同期间与表头、拒绝仅当月的来源、历史金额冲突及无证据变化时避免重复处理。T22-2 下一项为 T15 毛利系数，整案总额和人员导出待核算。
  t22_2_local_formula_handoff: 第 5 轮实跑自动通过 T12，三张毛利系数表编译通过，T15 公式尚未提交时下一模型请求因剩余额度不足而停止。程序现可从已核原格确认各档适用对象，绑定空毛利率口径、已核项目分类及系数表，再联合提交公式。制度明写的条件算式可绑定已核实际销售字段和原文常量后直接编译。第 5 轮副本经正式入口零模型调用连续通过 T15 和 T06，62 个项目两项数值逐项一致。下一项为 T16 库存系数，整案总额和人员导出待核算。
  evidence: analysis/commission_execution_202609/T21_goal_1000w/settlement-ef5b560b42197f89/formal-case/result.xlsx
  online_delivery: 按冻结版本和有效预算从本批原材料走正式流程；以该版本的财务确认、人员输出、逐项对账及独立批次记录验收。
