# 模型配置。选型阶段通过云端 API 调用三个候选模型；确定后改为本地 vLLM，只需切换 provider。
# 模型 ID 以服务商控制台为准，如有出入请直接修改 model 字段。
# 注意：调用云端 API 时，只使用脱敏后的规则文档和数据。

providers:
  dashscope:        # 阿里云百炼（OpenAI 兼容模式）
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
  local_vllm:       # 自建 vLLM，部署后使用
    base_url: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY

default: qwen3-vl-8b

models:
  qwen3-vl-32b:
    provider: dashscope
    model: qwen3-vl-32b-instruct
    json_mode: json_object      # 云端用 json_object；vLLM 可用 json_schema 做约束解码
  qwen3-vl-30b-a3b:
    provider: dashscope
    model: qwen3-vl-30b-a3b-instruct
    json_mode: json_object
  qwen3-vl-8b:
    provider: dashscope
    model: qwen3-vl-8b-instruct
    json_mode: json_object
  local-qwen3-vl-32b:
    provider: local_vllm
    model: Qwen/Qwen3-VL-32B-Instruct
    json_mode: json_schema

# 选型时参与对比的模型
candidates: [qwen3-vl-32b, qwen3-vl-30b-a3b, qwen3-vl-8b]
