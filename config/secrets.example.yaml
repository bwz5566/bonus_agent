# 复制为 config/secrets.yaml 后填写。secrets.yaml 已加入 .gitignore，不会被提交。
# 环境变量（如 DASHSCOPE_API_KEY）优先于这里的配置。
providers:
  dashscope:
    api_key: sk-xxxxxxxxxxxxxxxx
    # 可选：业务空间专属域名
    # base_url: https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  local_vllm:
    api_key: EMPTY
  local_qwen:
    api_key: sk-xxxxxxxxxxxxxxxx      # 内网 Qwen 服务的 Key，或设置环境变量 LOCAL_QWEN_API_KEY
  deepseek:
    api_key: sk-xxxxxxxxxxxxxxxx      # 或设置环境变量 DEEPSEEK_API_KEY
