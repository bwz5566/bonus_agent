name: PROCESS 过程奖
version: '2026Q3'
tables:
  R_DIFF: {kind: lookup, mapping: {'1': 1.00, '2': 1.10, '3': 1.25}}
pool:
  scope: 部门
  expr: >-
    sum(round(base_bonus * lookup(R_REGION, region) * if(contract_date >= "2026-01-01", 1.10, 0.95) * lookup(R_DIFF, difficulty), 2),
    where: status == "已验收" and between(acceptance_date, "2026-07-01", "2026-09-30"))
